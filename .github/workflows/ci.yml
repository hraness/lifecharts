name: Package CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.14.0, 24.20.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Check the exact packed distribution and installed command
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/lifecharts-package"
          mkdir "$output"
          npm pack --ignore-scripts --json --pack-destination "$output" > "$RUNNER_TEMP/lifecharts-pack.json"
          archive="$output/$(node -p "JSON.parse(require('node:fs').readFileSync(process.env.RUNNER_TEMP + '/lifecharts-pack.json', 'utf8'))[0].filename")"
          python3 scripts/verify-package.py "$archive" .
          node scripts/check-package.mjs "$archive"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.node == '24.20.0'
        with:
          bun-version: 1.3.14
      - name: Check Bun execution
        if: matrix.node == '24.20.0'
        run: bun bin/lifecharts.mjs --version
